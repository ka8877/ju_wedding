name: Verify deployed invitation

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naver-map:
    runs-on: ubuntu-latest
    # Pull requests diagnose the currently deployed site, not the PR preview.
    # Main must pass against its own completed Cloudflare production build.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Find this commit's Cloudflare deployment
        id: cloudflare
        uses: actions/github-script@v7
        with:
          script: |
            const productionUrl = 'https://hyunbum-juyoung.pages.dev';
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('search_url', productionUrl);
              return;
            }
            const pullRequest = context.payload.pull_request;
            const sha = pullRequest?.head.sha ?? context.sha;
            for (let attempt = 0; attempt < 30; attempt++) {
              const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: sha });
              const deployment = data.check_runs.find(run =>
                run.app?.slug === 'cloudflare-workers-and-pages'
                && run.details_url?.includes('/pages/view/hyunbum-juyoung/')
              );
              if (deployment?.status === 'completed') {
                if (deployment.conclusion !== 'success') throw new Error('Cloudflare deployment failed.');
                const previewUrl = deployment.output.summary?.match(/https:\/\/[a-z0-9-]+\.hyunbum-juyoung\.pages\.dev\b/)?.[0];
                if (pullRequest && !previewUrl) throw new Error('Cloudflare preview URL is missing.');
                core.setOutput('search_url', pullRequest ? previewUrl : productionUrl);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10_000));
            }
            throw new Error('Cloudflare deployment did not finish in five minutes.');
      - name: Verify venue search denies unauthenticated calls
        env:
          INVITATION_SEARCH_URL: ${{ steps.cloudflare.outputs.search_url }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL('/api/venue-search', process.env.INVITATION_SEARCH_URL);
          for (const authorization of [null, 'Bearer invalid-check-token']) {
            const headers = { 'Content-Type': 'application/json' };
            if (authorization) headers.Authorization = authorization;
            const response = await fetch(url, {
              method: 'POST', headers, body: JSON.stringify({ query: '정자역' }), signal: AbortSignal.timeout(15_000),
            });
            const body = await response.json().catch(() => null);
            const code = typeof body?.error === 'string' && /^[a-z_]+$/.test(body.error) ? body.error : 'unknown';
            const caller = authorization ? 'invalid token' : 'anonymous';
            console.log(`Venue search (${caller}): HTTP ${response.status}, ${code}`);
            if (![401, 403].includes(response.status) || !['login_required', 'admin_required'].includes(code)) {
              throw new Error(`Unexpected venue-search response for ${caller}.`);
            }
          }
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(`PLAYWRIGHT_CHROMIUM_EXECUTABLE=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Verify real production Naver map
        run: npx playwright test --config playwright.production.config.ts
      - name: Save production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-production/
          if-no-files-found: ignore
          retention-days: 7
