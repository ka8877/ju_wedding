name: Validate invitation

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invitation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - name: Install test browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(`PLAYWRIGHT_CHROMIUM_EXECUTABLE=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Test mobile editing and invitation
        env:
          VITE_LOCAL_PREVIEW: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
          VITE_NAVER_MAP_CLIENT_ID: ''
          VITE_KAKAO_JAVASCRIPT_KEY: ''
        run: npm run test:e2e && npm run test:e2e:guest
      - name: Diagnose public Supabase connection
        id: connection
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run check:connection
      - name: Build Cloudflare invitation
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_NAVER_MAP_CLIENT_ID: ${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ vars.VITE_KAKAO_JAVASCRIPT_KEY }}
          VITE_PUBLIC_SITE_URL: https://hyunbum-juyoung.pages.dev/
          BASE_PATH: /
        run: npm run build
