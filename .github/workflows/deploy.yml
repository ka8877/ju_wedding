name: Test and deploy invitation

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      connection_mode: ${{ steps.connection.outcome == 'success' && 'cloud' || 'unverified' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - name: Install test browser
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; console.log(`PLAYWRIGHT_CHROMIUM_EXECUTABLE=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Test mobile editing and invitation
        env:
          VITE_LOCAL_PREVIEW: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npm run test:e2e && npm run test:e2e:guest
      - name: Diagnose public Supabase connection
        id: connection
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run check:connection
      - name: Build free GitHub Pages site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_NAVER_MAP_CLIENT_ID: ${{ vars.VITE_NAVER_MAP_CLIENT_ID }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ vars.VITE_KAKAO_JAVASCRIPT_KEY }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REPOSITORY_NAME" = "$REPOSITORY_OWNER.github.io" ]; then
            export BASE_PATH=/
          else
            export BASE_PATH="/$REPOSITORY_NAME/"
          fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Write site and editor links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CONNECTION_MODE: ${{ needs.build.outputs.connection_mode }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const site = new URL(process.env.PAGE_URL);
          const editor = new URL(site); editor.hash = '/admin';
          const setup = new URL(site); setup.hash = '/setup';
          const connected = process.env.CONNECTION_MODE === 'cloud';
          const lines = [
            '## 모바일 청첩장 배포 완료',
            '',
            `- [청첩장 열기](${site.href})`,
            `- [관리 페이지 열기](${editor.href})`,
            `- [처음 한 번 연결 안내](${setup.href})`,
            `- Supabase 읽기 전용 연결 점검: ${connected ? '통과' : '미통과 — 설정 준비 또는 연결 상태 확인 필요'}`,
            '',
            connected
              ? '관리자 로그인·사진 업로드·다른 기기에서 공개 반영은 실제 계정으로 확인하세요.'
              : '코드 배포는 완료됐지만 실제 공개 저장은 아직 검증되지 않았습니다. 연결 안내에서 SQL·관리자 준비를 확인하세요.',
            '',
            '이후 main에 반영한 코드 변경은 이 workflow로 자동 배포됩니다. 무료 GitHub Pages 주소를 사용합니다.',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
